name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "echo 'db.runCommand({ping:1})' | mongosh --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MONGO_URL: mongodb://localhost:27017
      DB_NAME: yt_transcript_ci
      REDIS_URL: redis://localhost:6379/0
      CORS_ORIGINS: "*"
      EMERGENT_LLM_KEY: ${{ secrets.EMERGENT_LLM_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: System deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio pytest-timeout httpx
      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check backend/ tests/
      - name: Start Celery worker
        run: |
          cd backend
          celery -A celery_app.celery worker --loglevel=info --concurrency=2 -Q default,downloads,transcribe,ai &
          sleep 5
      - name: Start FastAPI
        run: |
          cd backend
          uvicorn server:app --host 0.0.0.0 --port 8001 &
          sleep 5
      - name: Run backend pytest
        env:
          PYTHONPATH: backend
          BASE_URL: http://localhost:8001
        run: |
          mkdir -p test_reports/pytest
          pytest backend/tests -v --timeout=60 --junitxml=test_reports/pytest/backend.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-report
          path: test_reports/pytest/

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install frontend deps
        working-directory: frontend
        run: yarn install --frozen-lockfile
      - name: Build
        working-directory: frontend
        run: yarn build
      - name: ESLint
        working-directory: frontend
        run: npx eslint "src/**/*.{js,jsx}" --max-warnings 0

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push'  # only on main pushes (cost control)
    env:
      BASE_URL: ${{ secrets.STAGING_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install Playwright
        run: |
          pip install pytest pytest-playwright
          playwright install --with-deps chromium
      - name: Run E2E
        run: |
          mkdir -p test_reports/e2e
          pytest tests/e2e -v --junitxml=test_reports/e2e/junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: test_reports/e2e/

  release-rollback-check:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Verify rollback artifacts exist
        run: |
          test -f docs/TESTING.md && echo "TESTING.md present"
          test -f SPECIFICATION.md && echo "SPECIFICATION.md present"
